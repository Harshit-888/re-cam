name: Android

# Why this exists
# --------------
# Arena.ai's sandbox has no JDK, no Android SDK and cannot reach dl.google.com,
# maven.google.com, repo1.maven.org or services.gradle.org, so it cannot build.
# Antigravity could, on one laptop, when someone remembered to run it — which is
# why docs/AGENTS_CHANGELOG.md contains a recurring species of entry:
# "fix(build): resolve Round NN compilation errors".
#
# This workflow makes GitHub the build authority. Arena pushes, reads the run via
# the Actions API, and quotes the compiler instead of predicting it. AGENTS.md §5
# asks for "BUILD SUCCESSFUL" as evidence; this is the cheapest honest source.
#
# It also settles a real ambiguity: the wrapper pins Gradle 9.1.0 while Android
# Studio was observed building with 9.6.0 (docs/TRIAGE_ANDROID_STUDIO_REPORT.md
# §2). CI uses ./gradlew, i.e. the wrapper, so "the build passes" gets one meaning.
#
# DESIGN NOTE — why the failure-reporting step exists:
# raw log download goes to results-receiver.actions.githubusercontent.com, which
# the Arena sandbox cannot reach. So the logs are also written to files and the
# failing lines are re-emitted as `::error::` annotations on failure: annotations
# *are* readable through api.github.com. Without this, a red run is a number.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A superseded push is not worth building; the SHA Arena reads is the newest.
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Trust the wrapper alone: no sdkmanager auto-downloads, no license prompts.
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk

jobs:
  build:
    name: test + assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 17, not 21: app/build.gradle.kts sets `jvmToolchain(17)`. If the runner's
      # JDK does not match the toolchain, Gradle tries to download one, which adds a
      # failure mode for no benefit. Pin the toolchain, not a newer JDK.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Installed directly rather than through a third-party action: one fewer
      # moving part, and a failure here names the URL that failed.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          url=https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/clt.zip "$url"
          unzip -q /tmp/clt.zip -d /tmp/clt
          mv /tmp/clt/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install platform and build tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          sdkmanager --list_installed

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Each Gradle step tees to its own log so the reporting step can quote it.
      # `pipefail` keeps the step's real exit code rather than tee's.
      - name: Unit tests
        id: tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee gradle-tests.log

      # Test totals as a *notice* annotation. Arena's sandbox cannot download run
      # logs (results-receiver.actions.githubusercontent.com) or artifacts (Azure
      # blob), but it can read check-run annotations through api.github.com — so
      # that is where the evidence has to be published, or "265 tests pass" stays
      # an unverifiable claim in a Markdown file.
      - name: Publish test totals
        if: always()
        run: |
          shopt -s nullglob
          totals=$(python3 - <<'PYEOF'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(path).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0))
              e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
          print(f"{t} tests, {f} failures, {e} errors, {s} skipped")
          PYEOF
          )
          echo "::notice::unit tests: ${totals}"

      - name: Assemble debug
        id: debug
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee gradle-debug.log

      # `release` is deliberately not built: it has no signing config in this repo,
      # and the benchmark type runs the same code non-debuggable. Add assembleRelease
      # here the day a keystore exists (docs/PROJECT_CONTEXT_AND_ROADMAP.md F8).
      - name: Assemble benchmark (non-debuggable, for perf numbers)
        id: bench
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleBenchmark 2>&1 | tee gradle-benchmark.log

      # The audit activity ships in every build type (it lives in src/main), so the
      # real invariant is not "benchmark-only": it is that its android:permission
      # guard survives. Without DUMP it is an exported activity any installed app
      # could start. The check reads the *merged* manifest out of each APK, i.e.
      # what ships, not what the source says.
      - name: APK sizes
        id: sizes
        run: |
          set -euo pipefail
          shopt -s nullglob
          for apk in app/build/outputs/apk/*/*.apk; do
            size=$(du -h "$apk" | cut -f1)
            names="$names $size:$(basename "$(dirname "$apk")")"
            printf '%s  %s\n' "$size" "$apk"
          done
          echo "::notice::APKs:${names:- none}"

      - name: Exported audit activity is DUMP-guarded
        run: |
          set -euo pipefail
          python3 tools/ci/check_audit_guard.py \
            --aapt2 "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" \
            app/build/outputs/apk/*/*.apk

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            gradle-*.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

      # The part that makes a red run legible from a sandbox with no log egress.
      - name: Report failure
        if: failure()
        run: |
          shopt -s nullglob
          for log in gradle-*.log; do
            echo "::error::--- $log ---"
            # Kotlin/Gradle error shapes, in the order they actually appear.
            grep -E "^e: |^w: .*error|error:|FAILURE:|What went wrong|Caused by|Could not (resolve|find|GET|download)|> Task .* FAILED" "$log" \
              | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          done

      # A one-line summary Arena can quote without downloading anything.
      - name: Summary
        if: always()
        run: |
          {
            echo "### Android build — \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "| step | result |"
            echo "| :--- | :--- |"
            echo "| unit tests | ${{ steps.tests.outcome || 'not run' }} |"
            echo "| debug APK | ${{ steps.debug.outcome || 'not run' }} |"
            echo "| benchmark APK | ${{ steps.bench.outcome || 'not run' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
