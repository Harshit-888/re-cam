name: Android

# Why this exists
# --------------
# Arena.ai's sandbox has no JDK, no Android SDK and cannot reach dl.google.com,
# maven.google.com, repo1.maven.org or services.gradle.org, so it cannot build.
# Antigravity could, on one laptop, when someone remembered to run it — which is
# why docs/AGENTS_CHANGELOG.md contains a recurring species of entry:
# "fix(build): resolve Round NN compilation errors".
#
# This workflow makes GitHub the build authority. Arena pushes, reads the run via
# the Actions API, and quotes the compiler instead of predicting it. AGENTS.md §5
# asks for "BUILD SUCCESSFUL" as evidence; this is the cheapest honest source.
#
# It also settles a real ambiguity: the wrapper pins Gradle 9.1.0 while Android
# Studio was observed building with 9.6.0 (see docs/TRIAGE_ANDROID_STUDIO_REPORT.md
# §2). CI uses ./gradlew, i.e. the wrapper, so "the build passes" gets one meaning.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A superseded push is not worth building; the SHA Arena reads is the newest.
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: test + assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 17, not 21: app/build.gradle.kts sets `jvmToolchain(17)`. If the runner's
      # JDK does not match the toolchain, Gradle tries to download one, which adds a
      # failure mode for no benefit. Pin the toolchain, not a newer JDK.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform and build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # `--no-daemon` because a fresh runner has nothing to reuse, and the daemon
      # only adds startup cost. `--stacktrace` because a failure report without it
      # is exactly the "unverifiable claim" the protocol forbids.
      - name: Unit tests
        id: tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Assemble debug
        id: debug
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      # `release` is deliberately not built: it has no signing config in this repo,
      # and the benchmark type runs the same code non-debuggable. Add assembleRelease
      # here the day a keystore exists (docs/PROJECT_CONTEXT_AND_ROADMAP.md F8).
      - name: Assemble benchmark (non-debuggable, for perf numbers)
        id: bench
        run: ./gradlew --no-daemon --stacktrace assembleBenchmark

      - name: APK sizes and manifest sanity
        run: |
          for apk in app/build/outputs/apk/*/*.apk; do
            printf '%s  %s\n' "$(du -h "$apk" | cut -f1)" "$apk"
          done
          # The benchmark audit activity must exist ONLY in the benchmark APK
          # (docs/REVIEW_874FCB0.md §3). A release/debug leak is a security finding,
          # so fail the build rather than print a warning.
          for v in debug release; do
            f="app/build/outputs/apk/$v/app-$v.apk"
            [ -f "$f" ] || continue
            if unzip -p "$f" classes*.dex 2>/dev/null | strings | grep -q BenchmarkAuditActivity; then
              echo "::error::BenchmarkAuditActivity leaked into $v APK"; exit 1
            fi
          done

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          retention-days: 14
          if-no-files-found: warn

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

      # A one-line summary Arena can quote without downloading anything.
      - name: Summary
        if: always()
        run: |
          {
            echo "### Android build — \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "| step | result |"
            echo "| :--- | :--- |"
            echo "| unit tests | ${{ steps.tests.outcome || 'see log' }} |"
            echo "| debug APK | ${{ steps.debug.outcome || 'see log' }} |"
            echo "| benchmark APK | ${{ steps.bench.outcome || 'see log' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
